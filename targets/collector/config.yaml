# OpenTelemetry Collector (contrib 0.162.0) for the OTel workloads' real ingest
# path: OTLP/HTTP in, ClickHouse exporter out. The exporter never creates schema
# (create_schema: false); the scenario's migrations own the DDL (ADR-0004).
# Batching follows the exporter README: sending_queue.batch instead of the batch
# processor. block_on_overflow applies backpressure instead of dropping data.
# Connection details come from the environment (set by targets/collector/up).
extensions:
  health_check:
    endpoint: 127.0.0.1:13133

receivers:
  otlp:
    protocols:
      http:
        endpoint: 127.0.0.1:4318

exporters:
  clickhouse:
    endpoint: ${env:CH_ENDPOINT}
    database: ${env:CH_DATABASE}
    username: ${env:CH_USER}
    password: ${env:CH_PASSWORD}
    create_schema: false
    async_insert: true
    compress: lz4
    timeout: 10s
    logs_table_name: otel_logs
    traces_table_name: otel_traces
    metrics_tables:
      gauge:
        name: otel_metrics_gauge
      sum:
        name: otel_metrics_sum
      summary:
        name: otel_metrics_summary
      histogram:
        name: otel_metrics_histogram
      exponential_histogram:
        name: otel_metrics_exponential_histogram
    sending_queue:
      enabled: true
      num_consumers: 4
      queue_size: 1000
      block_on_overflow: true
      batch:
        min_size: 10000
        flush_timeout: 1s
    retry_on_failure:
      enabled: true
      initial_interval: 1s
      max_interval: 10s
      max_elapsed_time: 300s

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: none
  pipelines:
    traces:
      receivers: [otlp]
      exporters: [clickhouse]
    logs:
      receivers: [otlp]
      exporters: [clickhouse]
    metrics:
      receivers: [otlp]
      exporters: [clickhouse]
