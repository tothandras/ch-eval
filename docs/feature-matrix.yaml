- title: Ingest semantics
  columns:
  - ID
  - Behavior
  - cloud
  - altinity / upstream-oss
  - Source
  - Planned probe
  rows:
  - id: IN-01
    openmeter_relevant: true
    evidence: '`probes/ingest/async_defaults.sql`'
    probes:
    - probes/ingest/async_defaults.sql
    cells:
      Behavior: '**`async_insert` default**'
      cloud: 1 since 26.2 *(h)*
      altinity / upstream-oss: 1 since 26.2 🔬 (`getSetting('async_insert')` returned `true` on both 26.3 images)
      Source: '[async-insert setting](https://clickhouse.com/docs/reference/settings/session-settings/async-insert) "26.2 … Enable async inserts by default."'
  - id: IN-02
    openmeter_relevant: true
    evidence: '`probes/ingest/async_defaults.sql` plus time-to-queryable measurement'
    probes:
    - probes/ingest/async_defaults.sql
    cells:
      Behavior: '**`wait_for_async_insert` default; flush timeout**'
      cloud: 1; "200 ms or 1000 ms on Cloud" *(h)*
      altinity / upstream-oss: 1; 200 ms *(h)*
      Source: '[asyncinserts](https://clickhouse.com/docs/concepts/features/operations/insert/asyncinserts)'
  - id: IN-03
    openmeter_relevant: true
    evidence: '`probes/ingest/dedup_retry_sync.sql` (identical block retried; OpenMeter-style retry with fresh `store_row_id`) + `probes/ingest/dedup_retry_async.sql`'
    probes:
    - probes/ingest/dedup_retry_sync.sql
    - probes/ingest/dedup_retry_async.sql
    cells:
      Behavior: '**Insert deduplication default**'
      cloud: On for all inserts since 26.2 (`deduplicate_insert=enable`). `async_insert_deduplicate` superseded. *(h)*
      altinity / upstream-oss: Same *(h)*
      Source: PRs [#95970](https://github.com/ClickHouse/ClickHouse/pull/95970), [#94413](https://github.com/ClickHouse/ClickHouse/pull/94413)
  - id: IN-04
    openmeter_relevant: true
    evidence: '`probes/ingest/dedup_window.sql` + `probes/ingest/dedup_plain_mergetree.sql`'
    probes:
    - probes/ingest/dedup_window.sql
    - probes/ingest/dedup_plain_mergetree.sql
    cells:
      Behavior: '**Deduplication window by engine**'
      cloud: SharedMergeTree follows replicated semantics ❓ *(h)*
      altinity / upstream-oss: '`replicated_deduplication_window=10000` (since 25.9). Plain `MergeTree` has `non_replicated_deduplication_window=0`, so it "deduplicates nothing". *(h)*'
      Source: '[deduplicating-inserts-on-retries](https://clickhouse.com/docs/concepts/features/operations/insert/deduplicating-inserts-on-retries)'
  - id: IN-05
    evidence: Probe query pair with and without `FINAL` on a populated table, per target
    probes: []
    cells:
      Behavior: '`ReplacingMergeTree … FINAL` read cost'
      cloud: measured
      altinity / upstream-oss: measured
      Source: —
