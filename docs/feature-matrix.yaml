    openmeter_relevant: true
    evidence: '`metadata.json` disks/policies + `probes/storage/storage_policies.sql`'
    probes:
    - probes/storage/storage_policies.sql
    cells:
      Aspect: '**Where the data lives**'
      cloud (separated): Object storage. Compute metadata is stateless ("Nothing is persisted on local disk"). *(h)*
      self-managed `ebs` (colocated): Local gp3 volume per replica *(h)*
      self-managed `s3` (self-separated): S3 objects per replica. Metadata stays local, "each replica independently manages its pointers to blobs", so replicas are not stateless. *(h)*
      Source: '[architecture](https://clickhouse.com/docs/products/cloud/reference/architecture), [shared-catalog](https://clickhouse.com/docs/products/cloud/features/infrastructure/shared-catalog), [storing-data](https://clickhouse.com/docs/concepts/features/configuration/server-config/storing-data)'
  - id: CS-02
    evidence: '`probes/locality/cache_introspection.sql` (`system.filesystem_cache`, `FilesystemCacheSize`, distributed-cache settings)'
    probes:
    - probes/locality/cache_introspection.sql
    cells:
      Aspect: Read caches
      cloud (separated): Per-replica SSD filesystem cache ("the SSD cache allows us to speed up queries") plus the optional distributed cache. **Conflicting:** a blog says nodes no longer use local disks for caching (*unverified verbatim*). ❓
      self-managed `ebs` (colocated): OS page cache *(h)*
      self-managed `s3` (self-separated): Filesystem cache disk (SLRU, `max_size`) plus OS page cache *(h)*
      Source: '[parallel-replicas](https://clickhouse.com/docs/products/cloud/features/infrastructure/parallel-replicas)'
  - id: CS-03
    openmeter_relevant: true
    evidence: '`s3` mode runs with on and off + `probes/locality/cache_on_write.sql`'
    probes:
    - probes/locality/cache_on_write.sql
    cells:
      Aspect: '**Cache populated on write**'
      cloud (separated): '`enable_filesystem_cache_on_write_operations`: "Cloud default value: `1`" *(h)*'
      self-managed `ebs` (colocated): n/a
      self-managed `s3` (self-separated): Off by default (`cache_on_write_operations=false`) *(h)*
      Source: session settings; storing-data
  - id: CS-04
    evidence: C1 (asymmetry recorded)
    probes: []
    cells:
      Aspect: Cold-read control
      cloud (separated): '`SYSTEM DROP FILESYSTEM CACHE`, `enable_filesystem_cache=0`. OS page cache unreachable. *(h)*'
      self-managed `ebs` (colocated): OS page-cache drop on the node (outside ClickHouse) *(h)*
      self-managed `s3` (self-separated): Filesystem-cache drop plus OS page-cache drop *(h)*
      Source: '[KB article](https://clickhouse.com/docs/resources/support-center/knowledge-base/cloud-services/execute-system-queries-in-cloud)'
  - id: CS-05
    evidence: C4 (defaults vs prewarm)
    probes: []
    cells:
      Aspect: Warm-up after a topology change
      cloud (separated): Scaling restarts processes, and "scaling takes time and invalidates local caches". Cloud-only prewarm levers exist (`cache_populated_by_fetch`, `prewarm_*`). *(h)*
      self-managed `ebs` (colocated): Page cache cold after a restart *(h)*
      self-managed `s3` (self-separated): Filesystem cache survives restarts ("Survives server restarts") *(h)*
      Source: '[scaling-recommendations](https://clickhouse.com/docs/products/cloud/features/autoscaling/scaling-recommendations), [userspace-page-cache](https://clickhouse.com/docs/concepts/features/performance/caches/userspace-page-cache)'
  - id: CS-06
    evidence: C3
    probes: []
    cells:
      Aspect: Insert path
      cloud (separated): Parts written to shared storage. Async flush 1000 ms / 100 MiB on Cloud vs 200 ms / 10 MiB upstream. *(h)*
      self-managed `ebs` (colocated): Local write *(h)*
      self-managed `s3` (self-separated): S3 multipart upload (16–32 MiB parts) *(h)*
      Source: shared-merge-tree; settings
  - id: CS-07
    openmeter_relevant: true
    evidence: C5 / R5
    probes: []
    cells:
      Aspect: '**Storage copies billed**'
      cloud (separated): One shared copy, "billed only once" across warehouses *(h)*
      self-managed `ebs` (colocated): N replicas × data, plus provisioned headroom *(h)*
      self-managed `s3` (self-separated): N replicas × data in S3 (no zero-copy) *(h)*
      Source: '[warehouses](https://clickhouse.com/docs/products/cloud/features/infrastructure/warehouses); storing-data'
  - id: CS-08
