# Source of truth for docs/feature-matrix.md (generated by `bench feature-matrix`).
# Each row: cited hypothesis cells per column, the probes that test it, and the
# evidence/experiment note. column_targets maps a column to the platforms whose
# probe results fill it.
preamble: |
  # Feature matrix: ClickHouse Cloud vs Altinity Stable vs upstream OSS

  > **Status: DRAFT (Phase 1). Every cell is a hypothesis taken from a cited
  > primary source, not a probed result.** In Phase 2 this file becomes
  > generated output: `bench feature-matrix` renders it from
  > `docs/feature-matrix.yaml` plus the probe results under
  > `results/probes/<target>/<run-id>/`. Once that happens, each cell shows the
  > probed status and the exact `version()` it was probed on. Rows whose probe has
  > not run on a target keep the hypothesis marker.

  Targets and versions (pinned in [`research/versions.md`](research/versions.md)):

  | Target | Planned version |
  | --- | --- |
  | **cloud** | ClickHouse Cloud. 26.6 on the Fast/Regular channels and 26.4 on Slow as of 2026-10-08. SharedMergeTree on object storage. |
  | **altinity** | `26.3.33.10001.altinitystable`, Altinity operator 0.27.4 plus ClickHouse Keeper |
  | **upstream-oss** | `26.3.33.24`, same base version and same topology as altinity |

  Legend:

  | Mark | Meaning |
  | --- | --- |
  | ✅ | available |
  | ❌ | not available |
  | ⚠️ | available with caveats |
  | ❓ | unverified in sources |
  | *(h)* | hypothesis, not yet probed |
  | 🔬 | observed ad hoc in the 2026-10-08 local smoke run; a formal probe is still pending |

  Citations point to the published docs URL. Docs text was verified against the
  docs source (`ClickHouse/ClickHouse/docs` at master `cd023af`) because
  clickhouse.com is unreachable from the build sandbox.

  **OpenMeter-relevant rows are bold.** Sections 9–11 were added at the owner's request on 2026-10-08. Each is a candidate for the design-decision
  callout at the top of `REPORT.md` once probed.
sections:
- title: Storage and replication
  columns:
  - ID
  - Capability
  - cloud
  - altinity / upstream-oss
  - Source
  - Planned probe
  rows:
  - id: ST-01
    openmeter_relevant: true
    evidence: '`probes/storage/engine_conversion.sql` + `probes/storage/replicated_engine_conversion.sql`'
    probes:
    - probes/storage/engine_conversion.sql
    - probes/storage/replicated_engine_conversion.sql
    cells:
      Capability: '**Engine actually used for `ENGINE = MergeTree` / `ReplicatedMergeTree`**'
      cloud: SharedMergeTree; Cloud "automatically substitutes the corresponding `Shared*` engine" *(h)*
      altinity / upstream-oss: As written. Plain `MergeTree` on a 2-replica cluster creates independent, unreplicated tables per replica. This is OpenMeter's hard-coded engine. *(h)*
      Source: '[cloud-compatibility](https://clickhouse.com/docs/products/cloud/guides/cloud-compatibility)'
  - id: ST-02
    evidence: '`probes/storage/database_engine.sql`'
    probes:
    - probes/storage/database_engine.sql
    cells:
      Capability: Database engine
      cloud: '`Shared` database engine "builds on and improves the behavior of the Replicated database engine" *(h)*'
      altinity / upstream-oss: '`Atomic` by default; `Replicated` available *(h)*'
      Source: '[shared-catalog](https://clickhouse.com/docs/products/cloud/features/infrastructure/shared-catalog)'
  - id: ST-03
    openmeter_relevant: true
    evidence: '`probes/storage/on_cluster.sql`'
    probes:
    - probes/storage/on_cluster.sql
    cells:
      Capability: '**`ON CLUSTER` DDL**'
      cloud: Accepted with cluster `default`. "Mostly no-op" wording is gone from the docs, so ❓
      altinity / upstream-oss: Required to fan DDL out to replicas, unless a `Replicated` DB is used *(h)*
      Source: '[execute-system-queries-in-cloud](https://clickhouse.com/docs/resources/support-center/knowledge-base/cloud-services/execute-system-queries-in-cloud)'
  - id: ST-04
    openmeter_relevant: true
    evidence: Storage bytes per replica in every perf run (`system.parts` per host) + `probes/storage/storage_policies.sql`
    probes:
    - probes/storage/storage_policies.sql
    cells:
      Capability: '**Part replication model**'
      cloud: Shared object storage. Replicas share parts and synchronize metadata via Keeper. *(h)*
      altinity / upstream-oss: Each replica fetches and stores its own copy of every part. On S3 disks without zero-copy, each replica writes its own S3 objects. *(h)*
      Source: '[shared-merge-tree](https://clickhouse.com/docs/products/cloud/features/infrastructure/shared-merge-tree), [storing-data](https://clickhouse.com/docs/concepts/features/configuration/server-config/storing-data)'
  - id: ST-05
    evidence: '`probes/storage/zero_copy_setting.sql`'
    probes:
    - probes/storage/zero_copy_setting.sql
    cells:
      Capability: Zero-copy replication on S3
      cloud: n/a
      altinity / upstream-oss: ⚠️ Off by default, "not recommended for production use" *(h)*
      Source: '[storing-data](https://clickhouse.com/docs/concepts/features/configuration/server-config/storing-data)'
  - id: ST-06
    openmeter_relevant: true
    evidence: '**`replica-consistency` workload** (stale-read rate, visibility lag, monotonicity violations)'
    probes: []
    cells:
      Capability: '**Cross-replica read-after-write visibility**'
      cloud: Metadata visibility is asynchronous. `select_sequential_consistency` and `SYSTEM SYNC REPLICA LIGHTWEIGHT` are available. *(h)*
      altinity / upstream-oss: Asynchronous replication with no fixed bound. `insert_quorum` + `select_sequential_consistency` is the documented hardening. *(h)*
      Source: '[replication](https://clickhouse.com/docs/reference/engines/table-engines/mergetree-family/replication), [SMT consistency](https://clickhouse.com/docs/products/cloud/features/infrastructure/shared-merge-tree#consistency)'
  - id: ST-07
    evidence: '`probes/storage/fs_cache.sql`'
    probes:
    - probes/storage/fs_cache.sql
    cells:
      Capability: Filesystem cache for remote disks; `enable_filesystem_cache=0` bypass
      cloud: ✅ *(h)*
      altinity / upstream-oss: ✅ on S3-backed storage policies only ("cache is supported only for remote disk types") *(h)*
      Source: '[storing-data](https://clickhouse.com/docs/concepts/features/configuration/server-config/storing-data), [settings](https://clickhouse.com/docs/reference/settings/session-settings)'
  - id: ST-08
    evidence: '`probes/storage/drop_caches.sql`'
    probes:
    - probes/storage/drop_caches.sql
    cells:
      Capability: Dropping caches for cold reads
      cloud: '`SYSTEM DROP FILESYSTEM CACHE` ✅. `DROP MARK/UNCOMPRESSED CACHE` ❓. OS page cache is not reachable. *(h)*'
      altinity / upstream-oss: All `SYSTEM DROP … CACHE`, plus the OS page cache on the node *(h)*
      Source: '[execute-system-queries-in-cloud](https://clickhouse.com/docs/resources/support-center/knowledge-base/cloud-services/execute-system-queries-in-cloud)'
  - id: ST-09
    evidence: '`probes/storage/distributed_cache.sql`'
    probes:
    - probes/storage/distributed_cache.sql
    cells:
      Capability: Distributed cache
      cloud: Cloud-only ("Only has an effect in ClickHouse Cloud"). GA ❓ *(h)*
      altinity / upstream-oss: ❌ *(h)*
      Source: '[distributed-cache settings](https://clickhouse.com/docs/reference/settings/session-settings/distributed-cache)'
  number: 1
  column_targets:
    cloud: &id001
    - cloud
    altinity / upstream-oss: &id002
    - altinity
    - upstream-oss
