- title: Cloud-only capabilities
  columns:
  - ID
  - Capability
  - cloud
  - self-managed
  - Source
  - Probe / evidence
  rows:
  - id: CO-01
    evidence: assessed, not measured (optional Cloud experiment)
    probes: []
    cells:
      Capability: Compute-compute separation (warehouses)
      cloud: ✅ Scale tier and above. Read-only services "don't execute background merges". *(h)*
      self-managed: ❌ No equivalent. The closest options are dedicated read replicas, or Antalya swarms for object-storage data. *(h)*
      Source: '[warehouses](https://clickhouse.com/docs/products/cloud/features/infrastructure/warehouses)'
  - id: CO-02
    evidence: Idle-floor COGS cell plus cost curves
    probes: []
    cells:
      Capability: Idle scaling and autoscaling
      cloud: Idling pauses compute billing. Vertical autoscaling on Scale/Enterprise. Horizontal autoscaling is "Private Preview". *(h)*
      self-managed: ❌ Manual; HPA is not meaningful for a stateful CH
      Source: '[idling](https://clickhouse.com/docs/products/cloud/features/autoscaling/idling), [autoscaling](https://clickhouse.com/docs/products/cloud/features/autoscaling/overview)'
  - id: CO-03
    evidence: assessed; OpenMeter's sink does not use it
    probes: []
    cells:
      Capability: ClickPipes managed ingest
      cloud: ✅ *(h)*
      self-managed: ❌
      Source: '[clickpipes](https://clickhouse.com/docs/integrations/clickpipes/home)'
  - id: CO-04
    evidence: '`backup-restore` experiment'
    probes: []
    cells:
      Capability: Managed backups
      cloud: 'Daily by default with 24 h retention. Scale/Enterprise: 1–45 days retention, every 6–48 h. Restores go to a new service. BYO-bucket export is not available for TDE services. *(h)*'
      self-managed: '❌ (self-run: clickhouse-backup or `BACKUP`)'
      Source: '[backups](https://clickhouse.com/docs/products/cloud/features/backups/overview)'
  - id: CO-05
    evidence: assessed + config evidence
    probes: []
    cells:
      Capability: Encryption at rest
      cloud: Default with provider-managed AES-256 keys. TDE/CMEK on Enterprise, chosen at service creation. *(h)*
      self-managed: 'Self-provided: EBS encryption, S3 SSE, or encrypted disks *(h)*'
      Source: '[cmek](https://clickhouse.com/docs/products/cloud/guides/security/cmek)'
  - id: CO-06
    evidence: '`probes/security/tls.go`'
    probes:
    - probes/security/tls.go
    cells:
      Capability: TLS in transit
      cloud: Native 9440 and HTTPS 8443 require TLS. Strict TLS-only is ❓ (one page mentions an unencrypted native connection). *(h)*
      self-managed: Operator-configured *(h)*
      Source: '[connection details](https://clickhouse.com/docs/get-started/quickstarts/obtain-your-cloud-connection-details)'
